# Builds the ground station (guiTool): AppImage for Raspberry Pi (aarch64) and Linux x64, a zip for
# Windows x64, and the architecture-independent CanSatGroundStation.pyz (+ run-on-pi.sh).
#
#   Release:   push a tag named  gui-vX.Y.Z   (e.g. gui-v0.1.0)  -> builds, then attaches
#              the three archives to a GitHub release for that tag.
#   Test run:  Actions tab -> "GUI release build" -> Run workflow  -> builds only, the archives
#              are kept as workflow artifacts (no release is created).
name: GUI release build

on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
          - arch: arm64          # Raspberry Pi 4/5 (64-bit OS), built under QEMU
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - name: Build in a Debian bookworm container (same glibc as Raspberry Pi OS Bookworm)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src/guiTool \
            python:3.12-bookworm bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq binutils libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                libdbus-1-3 libglib2.0-0 libxcb-cursor0 curl file
              python -m pip install -q -r requirements-build.txt
              python -m unittest discover -s tests
              pyinstaller cansat_gui.spec --noconfirm
              QT_QPA_PLATFORM=offscreen dist/CanSatGroundStation/CanSatGroundStation --selftest
              tools/make_appimage.sh
              QT_QPA_PLATFORM=offscreen build/CanSatGroundStation-*.AppImage --appimage-extract-and-run --selftest
              python tools/build_zipapp.py
              chmod -R a+rX build
            '
      - name: Package
        run: |
          mkdir -p out
          cp guiTool/build/CanSatGroundStation-*.AppImage out/
          if [ "${{ matrix.arch }}" = "x64" ]; then   # the .pyz is identical on every machine, publish it once
            cp guiTool/build/CanSatGroundStation.pyz guiTool/tools/run-on-pi.sh out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: guiTool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: pyinstaller cansat_gui.spec --noconfirm
      - name: Self test of the packaged exe
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/CanSatGroundStation/CanSatGroundStation.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Compress-Archive -Path dist/CanSatGroundStation -DestinationPath "../out/CanSatGroundStation-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Ground Station ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            Space Chamchu ground station (guiTool).

            **Raspberry Pi 4/5, 64-bit OS:** download `CanSatGroundStation-aarch64.AppImage`, then
            `chmod +x CanSatGroundStation-aarch64.AppImage && sudo apt install libfuse2 libxcb-cursor0`
            and run it (without libfuse2: `--appimage-extract-and-run`).

            **Any Raspberry Pi OS (also 32-bit):** download `CanSatGroundStation.pyz` and `run-on-pi.sh`
            into one folder and run `./run-on-pi.sh` (installs PyQt6 from apt on the first run).

            Add your user to the `dialout` group for serial access. Telemetry/CSV logs are saved in `~/CanSat Logs/`.
