# Builds the ground station (guiTool): AppImage for Raspberry Pi (aarch64) and Linux x64, a zip for
# Windows x64, and the architecture-independent CanSatGroundStation.pyz (+ run-on-pi.sh).
#
#   Release:   push a tag named  gui-vX.Y.Z   (e.g. gui-v0.1.0)  -> builds, then attaches
#              the files to a GitHub release for that tag. The release text is the "body:" below.
#   Test run:  Actions tab -> "GUI release build" -> Run workflow  -> builds only, the files
#              are kept as workflow artifacts (no release is created).
name: GUI release build

on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            appimage_arch: x86_64
          - arch: arm64          # Raspberry Pi 4/5 (64-bit OS), built under QEMU
            platform: linux/arm64
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - name: Build in a Debian bookworm container (same glibc as Raspberry Pi OS Bookworm)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e ARCH=${{ matrix.appimage_arch }} \
            -v "$PWD:/src" -w /src/guiTool \
            python:3.12-bookworm bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq binutils libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                libdbus-1-3 libglib2.0-0 libxcb-cursor0 curl file squashfs-tools
              # wheels only: on arm64 pip would otherwise try to build PyQt6 from source (needs qmake)
              python -m pip install -q --only-binary=:all: -r requirements-build.txt
              python -m unittest discover -s tests
              pyinstaller cansat_gui.spec --noconfirm
              QT_QPA_PLATFORM=offscreen dist/CanSatGroundStation/CanSatGroundStation --selftest
              tools/make_appimage.sh
              if [ "$ARCH" = x86_64 ]; then
                QT_QPA_PLATFORM=offscreen build/CanSatGroundStation-*.AppImage --appimage-extract-and-run --selftest
              else
                # arm64 runs under QEMU emulation here: try it, but a failure is only a warning
                # (the PyInstaller binary itself was already self-tested above)
                QT_QPA_PLATFORM=offscreen timeout 900 build/CanSatGroundStation-*.AppImage --appimage-extract-and-run --selftest \
                  || echo "WARNING: the arm64 AppImage could not be run under emulation"
              fi
              python tools/build_zipapp.py
              chmod -R a+rX build
            '
      - name: Package
        run: |
          mkdir -p out
          cp guiTool/build/CanSatGroundStation-*.AppImage out/
          if [ "${{ matrix.arch }}" = "x64" ]; then   # the .pyz is identical on every machine, publish it once
            cp guiTool/build/CanSatGroundStation.pyz guiTool/tools/run-on-pi.sh out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: guiTool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: pyinstaller cansat_gui.spec --noconfirm
      - name: Self test of the packaged exe
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/CanSatGroundStation/CanSatGroundStation.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Compress-Archive -Path dist/CanSatGroundStation -DestinationPath "../out/CanSatGroundStation-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: CANSAT gui ground station ${{ github.ref_name }}
          files: out/*
          generate_release_notes: false
          body: |
            # CANSAT gui ground station!

            <img width="1536" height="1024" alt="logo" src="https://github.com/user-attachments/assets/d873c5cb-69be-4f5a-94f3-1af86695eddb" />

            Ground station for the Space Chamchu CanSat. It receives the **mother CanSat's telemetry over a TBS Crossfire (CRSF) link**, shows it live, and records everything to CSV. It runs on a Raspberry Pi 4 with a Crossfire Micro TX V2.

            ## Features

            - **Live flight view** (Mission page): artificial horizon, mission-state bar (IDLE → WAIT → STAB → SPIN → OPEN → REST → WING → LANDED), values for attitude, yaw rate, acceleration, reaction-wheel command, altitude, speed, GPS, distance to home, RSSI and link quality, plus live plots.
            - **Ground track**: top-down map with the home point (where the drop was detected), the 50 m loiter circle and the aircraft heading.
            - **CSV recording**: one row per telemetry frame, saved automatically to `~/CanSat Logs/` together with the raw CRSF byte stream.
            - **Uplink switches**: AUX1 (drop arm) and AUX2 (elevon manual/auto) are sent to the CanSat from the Actions tab. AUX1 asks for confirmation.
            - **Demo mode**: a synthetic flight that goes through the real decode and CSV path, so you can try the program without hardware.
            - **Data page**: reads the child CanSat's EEPROM log over serial.

            ## Downloads

            | File | For |
            |------|-----|
            | `CanSatGroundStation-aarch64.AppImage` | **Raspberry Pi 4/5, 64-bit OS** |
            | `CanSatGroundStation-x86_64.AppImage` | Linux PC |
            | `CanSatGroundStation-…-windows-x64.zip` | Windows PC |
            | `CanSatGroundStation.pyz` + `run-on-pi.sh` | Any Raspberry Pi OS (also 32-bit), if the AppImage does not work |

            ## Raspberry Pi quick start

            ```bash
            sudo apt install libfuse2 libxcb-cursor0
            chmod +x CanSatGroundStation-aarch64.AppImage
            ./CanSatGroundStation-aarch64.AppImage
            ```

            - Without `libfuse2`, run it with `--appimage-extract-and-run`.
            - Alternative: put `CanSatGroundStation.pyz` and `run-on-pi.sh` in one folder and run `./run-on-pi.sh` (installs PyQt6 from apt the first time).
            - Serial access needs the `dialout` group: `sudo usermod -aG dialout $USER`, then log out and in.
            - In the **Mother** bar choose the serial port and **400000 baud** (CRSF to the Crossfire TX module).
            - Wiring between the Pi and the Crossfire module is in [`guiTool/pinmap.md`](https://github.com/lmwmason/CanSat-childish/blob/main/guiTool/pinmap.md).

            ## Known limitations

            - First release. It was tested with simulated data and virtual serial ports, **not yet with a real Crossfire module or on a Raspberry Pi**.
            - Check the Crossfire module's JR-bay pin order before powering it (see `pinmap.md`). The CRSF data pin is assumed to be pin 5.
            - The CanSat's custom status frame may not pass through every Crossfire link. If it is dropped, attitude, GPS and flight-mode text still arrive.
            - The Windows build is experimental.
