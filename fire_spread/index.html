<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화재 확산 분석</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{font-family:Inter,Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#26313e;background:#eef1f5;font-size:16px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}main{display:flex;height:100dvh;overflow:hidden}aside{width:440px;flex-shrink:0;background:#f9fafc;border-right:1px solid #dce2e9;display:flex;flex-direction:column;z-index:1000;box-shadow:2px 0 12px #2530470a}.panel-header{padding:24px 22px 19px;background:white;border-bottom:1px solid #e4e8ee}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#7d8999;font-weight:700;display:flex;align-items:center;gap:7px}.brand-dot{width:7px;height:7px;border-radius:50%;background:#4777d5}h1{font-size:20px;letter-spacing:-.7px;margin:9px 0 0;font-weight:720;line-height:1.3}.scroll{overflow-y:auto;flex:1;padding:6px 20px 20px;scrollbar-width:thin;scrollbar-color:#ccd4df transparent}section{padding:19px 0;border-bottom:1px solid #e1e6ed}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}h2{font-size:12px;letter-spacing:-.15px;font-weight:750;margin:0}.tag{color:#788596;font-size:10px;font-weight:600;background:#eaf0f7;border:1px solid #dde5ef;border-radius:5px;padding:3px 6px}.upload{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:105px;padding:16px;border:1px dashed #bdcadb;border-radius:9px;background:#fff;cursor:pointer;transition:.15s}.upload:hover,.upload:focus-within{border-color:#527bd0;background:#f3f7ff}.upload-icon{width:27px;height:27px;color:#6a80a0}.upload strong{font-size:12px;font-weight:650}.upload .hint{font-size:10px;color:#8894a4}.upload input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.filename{color:#42618c;font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{cursor:pointer;transition:background .15s,box-shadow .15s;border-radius:7px;font-weight:650;border:1px solid #d9e0e9;background:white;color:#56677b;padding:8px 11px}button:hover{background:#eef3fa;border-color:#b8c9e0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #aac5ff;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}.optional{width:100%;font-size:11px;margin-top:9px;background:transparent;border-color:transparent;color:#75839a}.readout{font-size:11px;color:#6f7d90;line-height:1.7;margin-top:11px;white-space:pre-line;overflow-wrap:anywhere}.readout:empty{display:none}.location{display:flex;align-items:center;gap:8px;background:#eef2f8;border:1px solid #e0e6ef;border-radius:7px;padding:11px 12px;color:#74849a;font-size:12px;font-variant-numeric:tabular-nums}.location-dot{width:7px;height:7px;border:2px solid #94a5bd;border-radius:50%;flex-shrink:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}label.field{display:block;min-width:0}.label{display:block;color:#69788b;font-size:11px;margin-bottom:7px;letter-spacing:-.2px}.input-wrap{display:flex;align-items:center;border:1px solid #d9e1ec;border-radius:7px;background:white;overflow:hidden}.input-wrap:focus-within{border-color:#6991da;box-shadow:0 0 0 3px #e8f0ff}.input-wrap input{border:0;outline:0;min-width:0;width:100%;padding:10px 11px;color:#2c3d53;background:transparent;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.unit{color:#9aa5b3;font-size:10px;padding-right:10px;flex-shrink:0}.wide{grid-column:1/-1}.footer{padding:15px 20px 18px;background:white;border-top:1px solid #e0e6ed}#run{width:100%;background:#315fae;border-color:#315fae;color:white;font-size:13px;letter-spacing:-.2px;padding:12px;box-shadow:0 3px 6px #315fae1b}#run:hover{background:#264e94}.status{font-size:11px;line-height:1.65;color:#6d7c91;white-space:pre-line;margin:10px 0 0;overflow-wrap:anywhere}.status:empty{display:none}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.legend-item{font-size:10px;color:#788697}.swatch{height:5px;border-radius:3px;display:block;margin-bottom:7px}.legend-foot{display:flex;align-items:center;gap:5px;font-size:10px;color:#8d98a7;margin-top:13px}.legend-foot i{width:7px;height:7px;background:#aaa;border-radius:2px}#map{flex:1;min-width:0;background:#e8edf2}.map-wrap{position:relative;flex:1;display:flex;min-width:0}.map-tip{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:500;background:#ffffffed;border:1px solid #dde4ec;box-shadow:0 3px 14px #23354b0e;border-radius:7px;padding:9px 14px;font-size:11px;color:#6c7c91;white-space:nowrap;pointer-events:none}.leaflet-control-zoom{border:1px solid #d5dfe9!important;box-shadow:0 2px 8px #24385010!important}.leaflet-control-zoom a{color:#52677e!important}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:9px!important}
@media(max-width:700px){main{height:auto;min-height:100dvh;flex-direction:column}aside{width:100%;max-height:55dvh}.panel-header{padding:15px 20px}.eyebrow{display:none}h1{margin:0;font-size:18px}.map-wrap{height:55dvh;min-height:350px;flex:none}.scroll{padding-top:0}section{padding:15px 0}.footer{padding:12px 20px}}

.panel-header{padding:20px 22px}h1{margin:0;font-size:22px}.section-heading h2{font-size:16px}.label{font-size:15px;color:#566579}.input-wrap input{font-size:16px;font-weight:500;padding:10px 11px}.unit{font-size:13px;color:#748295}.upload{min-height:46px;flex-direction:row;justify-content:flex-start;padding:11px 12px;gap:10px;border-style:solid}.upload strong{font-size:15px;font-weight:500}.filename{font-size:13px}.optional{font-size:14px}.readout{font-size:14px;color:#63738a}.location{font-size:15px}.legend-item{font-size:13px}.legend-foot{font-size:13px}.status{font-size:14px}#run{font-size:16px}.map-tip{font-size:14px}.section-heading>span{font-size:14px}.footer{padding:15px 20px}.eyebrow,.tag,.brand-dot,.upload-icon,.location-dot{display:none}
.upload{min-height:132px;flex-direction:column;justify-content:center;gap:8px;padding:18px 14px;border:1px dashed #afbed1;border-radius:9px;background:#fff}.upload-icon{display:block;width:27px;height:27px;color:#6a80a0}.upload strong{font-size:16px;font-weight:600}.upload .hint{font-size:13px;color:#7a899d}.upload.dragging{background:#eef4ff;border-color:#4777c5}.upload .filename:empty{display:none}
select{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid #d9e1ec;border-radius:7px;background:white;color:#26313e}.wind-options{margin-top:12px}.wind-options summary{font-size:14px;color:#63738a;cursor:pointer}.wind-options .fields{margin-top:13px}
.profile-table{margin-top:10px;width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.profile-table td,.profile-table th{text-align:right;padding:7px 3px;border-bottom:1px solid #e1e6ed}.profile-table th{font-weight:500;color:#66758a}
.vector-toggle{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:#526277;cursor:pointer}.vector-toggle input{width:17px;height:17px;accent-color:#315fae}
</style>
</head>
<body><main>
<aside>
<header class="panel-header"><h1>화재 확산 분석</h1></header>
<div class="scroll">
<section><div class="section-heading"><h2>관측 기록</h2></div>
<label class="upload" id="dropzone"><svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg><strong>기록 파일 선택</strong><span class="hint">events.csv · traffic.jsonl</span><span class="filename" id="filename"></span><input id="file" type="file" accept=".csv,.jsonl,text/csv,application/json" aria-label="관측 기록 파일 선택"></label>
<button id="wind" class="optional">지상국 관측 가져오기</button><div id="windstatus" class="readout"></div></section>
<section><div class="section-heading"><h2>발화 위치</h2></div><div class="location"><span id="location">지도에서 위치 선택</span></div></section>
<section><div class="section-heading"><h2>바람장</h2></div>
<label class="field"><span class="label">계산 방식</span><select id="windmethod"><option value="terrain">고도별 관측 + 지형 바람 모델</option><option value="observed">관측 범위 내 보간</option></select></label>
<details class="wind-options"><summary>고도·지표 조건</summary><div class="fields">
<label class="field"><span class="label">고도 기준 보정</span><span class="input-wrap"><input id="groundoffset" type="number" min="-500" max="500" value="0"><span class="unit">m</span></span></label>
<label class="field"><span class="label">수관 높이</span><span class="input-wrap"><input id="canopy" type="number" min="0" max="60" value="0"><span class="unit">m</span></span></label>
<label class="field wide"><span class="label">지표 거칠기</span><select id="vegetation"><option value="grass">초지</option><option value="brush">관목</option><option value="trees">수목</option></select></label>
</div></details><label class="vector-toggle"><input id="showvectors" type="checkbox"> 바람 벡터 표시</label><div id="windmodelstatus" class="readout"></div><details class="wind-options"><summary>고도별 관측</summary><table class="profile-table"><thead><tr><th>GPS 고도(m)</th><th>동(m/s)</th><th>북(m/s)</th><th>표본</th></tr></thead><tbody id="profile"></tbody></table></details></section>
<section><div class="section-heading"><h2>계산 영역</h2></div><div class="fields">
<label class="field"><span class="label">반경</span><span class="input-wrap"><input id="radius" type="number" min="20" max="1000" step="10" value="100"><span class="unit">m</span></span></label>
<label class="field"><span class="label">격자 간격</span><span class="input-wrap"><input id="cell" type="number" min="5" max="200" step="5" value="10"><span class="unit">m</span></span></label>
<label class="field wide"><span class="label">바람 보간 거리</span><span class="input-wrap"><input id="distance" type="number" min="10" max="1000" value="100"><span class="unit">m</span></span></label>
</div></section>
<section><div class="section-heading"><h2>모델 조건</h2></div><div class="fields">
<label class="field"><span class="label">풍속 보정 계수</span><span class="input-wrap"><input id="factor" type="number" min="0" max="2" step="0.1" value="1"><span class="unit">×</span></span></label>
<label class="field"><span class="label">사연료 수분 비율</span><span class="input-wrap"><input id="moisture" type="number" min="0.01" max="0.6" step="0.01" value="0.08"><span class="unit">0–1</span></span></label>
</div></section>
<section style="border-bottom:0"><div class="section-heading"><h2>예상 도달 시간</h2><span>분</span></div><div class="legend"><div class="legend-item"><i class="swatch" style="background:#d32828"></i>0–10</div><div class="legend-item"><i class="swatch" style="background:#f27820"></i>10–30</div><div class="legend-item"><i class="swatch" style="background:#f4c339"></i>30–60</div><div class="legend-item"><i class="swatch" style="background:#43a4db"></i>60–120</div></div><div class="legend-foot"><i></i>미계산 영역</div></section>
</div><footer class="footer"><button id="run">확산 계산</button><p id="status" class="status" role="status" aria-live="polite"></p></footer>
</aside><div class="map-wrap"><div id="map"></div><div class="map-tip">관측 기록을 불러오세요</div></div>
</main><script>

const map=L.map('map',{preferCanvas:true}).setView([36.5,127.5],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let point=null,marker=null,overlay=L.layerGroup().addTo(map), observations=L.layerGroup().addTo(map), currentCsv=null, source='file',windVectors=L.layerGroup(),vectorData=[],vectorSpacing=10;const $=id=>document.getElementById(id);map.on('click',e=>{overlay.clearLayers();windVectors.clearLayers();vectorData=[];$('status').textContent='';point=e.latlng;if(marker)map.removeLayer(marker);marker=L.marker(point).addTo(map);$('location').textContent=`발화점: ${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`});function showField(j){$('windmodelstatus').textContent='';$('profile').replaceChildren();for(const p of j.profile||[]){const row=document.createElement('tr');for(const v of [p.altitude_m.toFixed(1),p.east.toFixed(2),p.north.toFixed(2),p.count]){const cell=document.createElement('td');cell.textContent=v;row.appendChild(cell)}$('profile').appendChild(row)}point=null;if(marker){map.removeLayer(marker);marker=null}$('location').textContent='지도에서 위치 선택';$('status').textContent='';$('windstatus').textContent=`관측 ${j.count}개 · ${j.duration_s.toFixed(0)}초 구간\n고도 ${j.altitude_range_m[0].toFixed(1)}–${j.altitude_range_m[1].toFixed(1)} m`;document.querySelector('.map-tip').textContent='발화 위치를 선택하세요';observations.clearLayers();overlay.clearLayers();L.polygon(j.polygon,{color:'#23548d',weight:2,fillOpacity:.04}).addTo(observations);vectorData=j.vectors;vectorSpacing=j.vector_spacing_m;drawWindVectors();for(const p of j.observations)L.circleMarker([p.lat,p.lon],{radius:3,color:'#174e8b',fillOpacity:.8}).bindTooltip(`관측 고도 ${p.altitude.toFixed(1)} m · 동 ${p.east.toFixed(2)}, 북 ${p.north.toFixed(2)} m/s`).addTo(observations);if(j.observations.length)map.fitBounds(j.observations.map(p=>[p.lat,p.lon]),{padding:[40,40],maxZoom:18})}
async function loadCsv(text){windVectors.clearLayers();vectorData=[];currentCsv=null;source='file';observations.clearLayers();overlay.clearLayers();let r=await fetch('/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'file',csv:text})}),j=await r.json();if(!r.ok)throw Error(j.error);currentCsv=text;source='file';showField(j)}
async function readFile(file){if(!file)return;try{$('filename').textContent=file.name;await loadCsv(await file.text())}catch(e){$('windstatus').textContent=e.message}}
function drawWindVectors(){windVectors.clearLayers();if(!$('showvectors').checked){map.removeLayer(windVectors);return}windVectors.addTo(map);const stride=Math.max(1,Math.ceil(vectorData.length/400));for(let i=0;i<vectorData.length;i+=stride){const p=vectorData[i],speed=Math.hypot(p.east,p.north);if(speed<.01)continue;const unit=vectorSpacing*.35/speed/111195,dy=p.north*unit,dx=p.east*unit/Math.cos(p.lat*Math.PI/180),tip=[p.lat+dy,p.lon+dx],back=[p.lat+dy*.65,p.lon+dx*.65],sideLat=dx*Math.cos(p.lat*Math.PI/180)*.25,sideLon=dy/Math.cos(p.lat*Math.PI/180)*.25;L.polyline([[p.lat,p.lon],tip,[back[0]+sideLat,back[1]-sideLon],tip,[back[0]-sideLat,back[1]+sideLon]],{color:'#173c65',weight:1.5,opacity:.8}).bindTooltip(`동 ${p.east.toFixed(2)}, 북 ${p.north.toFixed(2)} m/s`).addTo(windVectors)}}
$('showvectors').onchange=drawWindVectors;
$('file').onchange=()=>readFile($('file').files[0]);
const dropzone=$('dropzone');
dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('dragging')});
dropzone.addEventListener('dragleave',e=>{if(!dropzone.contains(e.relatedTarget))dropzone.classList.remove('dragging')});
dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('dragging');readFile(e.dataTransfer.files[0])});
$('wind').onclick=async()=>{try{let r=await fetch('/wind'),j=await r.json();if(!r.ok)throw Error(j.error);source='live';currentCsv=null;showField(j)}catch(e){$('windstatus').textContent=e.message}};
$('run').onclick=async()=>{if(!point){$('status').textContent='먼저 지도를 눌러 발화점을 지정하세요.';return}if(source==='file'&&!currentCsv){$('status').textContent='먼저 저장된 바람 관측을 불러오세요.';return}let b=$('run');b.disabled=true;b.textContent='계산 중…';overlay.clearLayers();windVectors.clearLayers();vectorData=[];$('status').textContent='바람장·지형·식생 조회 및 계산 중…';try{let r=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:source,csv:currentCsv,wind_method:$('windmethod').value,ground_offset:+$('groundoffset').value,canopy:+$('canopy').value,vegetation:$('vegetation').value,lat:point.lat,lon:point.lng,radius:+$('radius').value,cell:+$('cell').value,moisture:+$('moisture').value,wind_factor:+$('factor').value,max_distance:+$('distance').value})});let j=await r.json();if(!r.ok)throw Error(j.error);for(let c of j.cells){let v=c.arrival_min,color=!c.wind||![10,20,30,40].includes(c.landcover)?'#888':v===null||v>120?null:v<=10?'#d32828':v<=30?'#f27820':v<=60?'#f4c339':'#43a4db',dy=j.cell_m/111195/2,dx=dy/Math.cos(c.lat*Math.PI/180);if(color)L.rectangle([[c.lat-dy,c.lon-dx],[c.lat+dy,c.lon+dx]],{stroke:false,fillColor:color,fillOpacity:.55}).bindTooltip(v===null?'미계산 또는 미도달':`도달 시간 ${v.toFixed(1)}분`).addTo(overlay);} vectorData=j.cells.filter(c=>c.wind).map(c=>({lat:c.lat,lon:c.lon,east:c.wind[0],north:c.wind[1]}));vectorSpacing=j.cell_m;drawWindVectors(); $('windmodelstatus').textContent=j.wind_model.method==='WindNinja point initialization'?`지형 모델 · 고도별 입력 ${j.wind_model.station_count}/${j.wind_model.profile_bin_count}개 · 출력 높이 ${j.wind_model.output_height_above_vegetation_m} m\n관측 경로 밖은 모델 추정`: '관측 범위 내 보간';$('status').textContent=`관측 ${j.wind_observations}개, 시간차 ${j.wind_time_span_s.toFixed(0)}초, 고도 ${j.wind_altitude_range_m.map(x=>x.toFixed(1)).join('–')}m.\n색상은 도달 시간이며 확률이 아닙니다.`}catch(e){$('status').textContent='계산 실패: '+e.message}finally{b.disabled=false;b.textContent='확산 계산'}};
</script></body></html>
