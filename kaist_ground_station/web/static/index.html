<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Chamchu Integral — Ground Station</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root { color-scheme:dark; --bg:#000; --panel:#05111f; --border:#fff; --text:#fff; --muted:#b0b0b0; --grid:#045956;
  --button:#514c4b; --button_active:#6e6968; --ok:#0f0; --warn:#ff0; --bad:#f00;
  --line1:#0ff; --line2:#f00; --line3:#0f0; --line4:#ff0; --on:#005a1f;
  --font:"Noto Sans CJK KR","NanumGothic",system-ui,sans-serif; --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  --s:14px; --m:15px; --l:24px; }   /* the whole type scale; derived from [sizes] base at start-up */
* { box-sizing:border-box; margin:0; padding:0; border-radius:0; }
html, body { height:100%; background:var(--bg); color:var(--text); font:var(--m)/1.3 var(--font); overflow-x:hidden; overflow-y:auto; }
body { display:flex; flex-direction:column; gap:4px; padding:4px; min-height:100%; }
.num, input, select, pre, td { font-variant-numeric:tabular-nums; }

/* connection row */
#bar img.logo { height:44px; width:auto; display:block; margin:-2px 8px -2px 0; }
#bar { display:flex; flex-wrap:wrap; align-items:center; gap:4px; border:2px solid var(--border); background:var(--panel); padding:4px; }
input, select, button { font:inherit; color:var(--text); background:#000; border:1px solid var(--muted); padding:3px 6px; min-height:26px; }
input[type=checkbox] { min-height:0; width:16px; height:16px; }
select { appearance:none; -webkit-appearance:none; padding-right:24px; cursor:pointer;
  background:#000 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23b0b0b0' stroke-width='2'/></svg>") no-repeat right 7px center; }
select:hover, input:hover { border-color:var(--text); }
select option { background:#000; color:var(--text); }
button { background:var(--button); border:1px solid var(--border); font-weight:bold; cursor:pointer; padding:3px 12px; }
button:hover { background:var(--button_active); }
button:disabled { color:var(--muted); border-color:var(--muted); cursor:not-allowed; background:#222; }
label { color:var(--muted); }
button#rec { min-width:7.5em; } button#rec.on { background:var(--bad); border-color:var(--bad); color:#fff; }
#linkq.ok { color:var(--ok); border-color:var(--ok); } #linkq.warn { color:var(--warn); border-color:var(--warn); } #linkq.bad { color:var(--bad); border-color:var(--bad); } #linkq { cursor:help; }
#recchip.on { border-color:var(--bad); color:var(--bad); } #recchip.idle { border-color:var(--warn); color:var(--warn); }
#status { margin-left:auto; font-weight:bold; font-size:calc(var(--m) + 2px); }
#error { color:var(--bad); font-weight:bold; }

/* phase / elapsed / alarm summary */
#strip { display:flex; gap:4px; }
#strip .chip { border:2px solid var(--border); background:var(--panel); padding:2px 10px; font:bold var(--m) var(--mono); white-space:nowrap; }
#strip .chip small { color:var(--muted); font-weight:normal; margin-right:6px; font-family:var(--font); font-size:var(--s); }
#strip #almsum { flex:1; overflow:hidden; text-overflow:ellipsis; }
#strip #almsum.warn { border-color:var(--warn); color:var(--warn); } #strip #almsum.bad { border-color:var(--bad); color:var(--bad); }

/* the six numbers an operator reads during descent */
#metrics { display:grid; gap:4px; }
body[data-page=flight] #metrics { grid-template-columns:1fr 1.45fr 1.35fr 1.5fr 1fr 1fr; }
body[data-page=wind] #metrics { grid-template-columns:1.1fr 1fr 1.25fr 1.5fr 1fr 1fr; }
.metric { border:2px solid var(--border); background:var(--panel); padding:2px 8px 3px; min-width:0; display:flex; flex-direction:column; }
.metric .k { color:var(--muted); display:flex; gap:6px; align-items:baseline; white-space:nowrap; }
.metric .k .hint { margin-left:auto; font:var(--s) var(--mono); }
.metric .v { font:bold var(--l)/1.1 var(--mono); white-space:nowrap; overflow:hidden; }
.metric .v small { font-size:var(--s); color:var(--muted); font-weight:normal; }
.metric .sub { font:var(--s) var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.metric.bad { border-color:var(--bad); } .metric.bad .v { color:var(--bad); }
.metric.warn { border-color:var(--warn); } .metric.warn .v { color:var(--warn); }
#driftbox { display:flex; align-items:center; gap:8px; }
#c-compass { width:54px; height:54px; flex:none; }
#ground { width:5.5em; padding:0 3px; min-height:20px; }

/* panel grid: 12 columns, explicit placement */
.grid { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:4px; flex:1; min-height:600px; position:relative; }
#grid-wind { grid-template-rows:minmax(0,7fr) minmax(0,5fr) minmax(280px,4fr); }   /* bottom row never below 280px: the checkpoint list must stay visible */
#grid-flight { grid-template-rows:minmax(0,8fr) minmax(0,6fr) minmax(0,4fr); }
body[data-page=flight] .wind, body[data-page=wind] .flight { display:none !important; }
.panel { border:2px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-width:0; min-height:0; }
/* wind-field window: 3 rows, everything visible at once */
#p3d { grid-column:1 / 5; grid-row:1; } #p3dc { grid-column:5 / 9; grid-row:1; } #pmap { grid-column:9 / 13; grid-row:1; }
#pprof { grid-column:1 / 4; grid-row:2; } #pdrift { grid-column:4 / 8; grid-row:2; } #pdtab { grid-column:8 / 13; grid-row:2; }
#prawstream { grid-column:1 / 10; grid-row:3; } #pcp { grid-column:10 / 13; grid-row:3; }
/* flight window: 3 rows + the communication strip */
#pattitude { grid-column:1 / 4; grid-row:1; } #pcam { grid-column:4 / 8; grid-row:1; } #pqlook { grid-column:8 / 10; grid-row:1; } #palt { grid-column:10 / 13; grid-row:1; }
#pimu { grid-column:1 / 4; grid-row:2; } #pomega { grid-column:4 / 7; grid-row:2; } #pvel { grid-column:7 / 10; grid-row:2; } #patlm { grid-column:10 / 13; grid-row:2; }
#pstream { grid-column:1 / 5; grid-row:3; } #praw { grid-column:5 / 9; grid-row:3; } #palarm { grid-column:9 / 13; grid-row:3; }

.panel > h2 { display:flex; gap:10px; align-items:baseline; padding:2px 8px; font-size:var(--m); font-weight:bold; white-space:nowrap; overflow:hidden; }
.panel > h2 .st { margin-left:auto; color:var(--muted); font:var(--s) var(--mono); font-weight:normal; }
.legend span { margin-right:8px; font-weight:bold; }
.panel canvas { flex:1; min-height:0; width:100%; display:block; }
#c3d { cursor:grab; touch-action:none; }
.note { font:var(--s) var(--mono); color:var(--muted); padding:0 8px 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kv { display:flex; gap:6px; align-items:center; font:var(--s) var(--mono); padding:0 8px; white-space:nowrap; break-inside:avoid; }
.kv .l { color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; } .kv .r { font-weight:bold; } .kv .u { color:var(--muted); width:2.4em; }
#raw { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); align-content:start; column-gap:4px; padding:2px 0; overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; }


/* SCADA-style status tables */
table.st { border-collapse:collapse; width:100%; font:var(--s) var(--mono); }
table.st th { text-align:left; color:var(--muted); font-weight:normal; padding:1px 8px; border-bottom:1px solid var(--grid); position:sticky; top:0; background:var(--panel); }
table.st td { padding:1px 8px; white-space:nowrap; border-bottom:1px solid #0b2a36; }
table.st td.n { text-align:right; font-weight:bold; }
#dtab th, #streams th:nth-child(n+3) { text-align:right; }
.led { display:inline-block; width:11px; height:11px; border-radius:50%; background:#444; vertical-align:middle; }
.led.ok { background:var(--ok); } .led.warn { background:var(--warn); } .led.bad { background:var(--bad); }
tr.a-bad td { color:var(--bad); font-weight:bold; } tr.a-warn td { color:var(--warn); } tr.a-clr td { color:var(--muted); }
#imgprog { padding:3px 8px 4px; font:var(--s) var(--mono); color:var(--muted); }
#imgprog .bar { height:8px; border:1px solid var(--muted); margin-top:2px; } #imgprog .bar i { display:block; height:100%; background:var(--line1); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); }
.dot.ok { background:var(--ok); }

/* communication: always visible, never inside the drawer */
#comm { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,4fr) minmax(0,2fr) minmax(0,3fr); gap:4px; height:clamp(165px, 22vh, 250px); flex:none; }
#comm .panel > h2 { padding-top:1px; }
#comm .row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding:3px 6px; }
#comm #term { flex:1; min-width:8em; }
#tx-state { font-weight:bold; } #tx-state.on { color:var(--bad); }
pre { font:var(--s)/1.3 var(--mono); padding:4px 8px; overflow:auto; white-space:pre-wrap; word-break:break-all; flex:1; min-height:0; }
.scroll { overflow:auto; flex:1; min-height:0; }
#bits { display:grid; grid-template-columns:repeat(8, 1fr); gap:2px; padding:4px; align-content:start; }
#bits div { border:1px solid var(--grid); text-align:center; font:var(--s) var(--mono); padding:2px 0; color:var(--muted); }
#bits div.on { background:var(--on); color:var(--text); border-color:var(--ok); font-weight:bold; }

/* one-line event strip */
#events { display:flex; gap:12px; align-items:center; border:2px solid var(--border); background:var(--panel); padding:3px 8px; font:var(--s) var(--mono); white-space:nowrap; overflow:hidden; }
#events .m { color:var(--text); overflow:hidden; text-overflow:ellipsis; }
#events .n { color:var(--muted); overflow:hidden; text-overflow:ellipsis; flex:1; }
#events .f { color:var(--muted); margin-left:auto; }

.imgbox { position:relative; flex:1; min-height:0; background:#000; display:flex; align-items:center; justify-content:center; }
.imgbox img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
.imgbox .empty { position:absolute; color:var(--muted); font:var(--s) var(--mono); }
#rawstream { font-size:var(--s); white-space:pre-wrap; }
#cpbtns { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:3px; padding:3px 4px; flex:none; }
#cpbtns button { min-height:30px; padding:1px 4px; font-size:var(--s); }
#cpbtns button.mark { grid-column:1 / -1; }
#cpbtns button.undo { background:#000; border-color:var(--muted); color:var(--muted); font-weight:normal; }
#cpbtns button.hit { background:var(--ok); color:#000; border-color:var(--ok); }
#cplist td.t { color:var(--muted); }
.row2 { display:flex; gap:8px; align-items:center; margin-left:auto; font:var(--s) var(--font); }
</style>
</head>
<body>
<div id="bar">
  <img class="logo" src="/logo.png" alt="Space Chamchu Integral">
  <label data-t="transport"></label><select id="kind"></select>
  <label data-t="port"></label><input id="port" list="ports" size="16"><datalist id="ports"></datalist>
  <label data-t="baud"></label><input id="baud" value="115200" size="7">
  <button id="connect" data-t="connect"></button><button id="stop" data-t="stop"></button><button id="rec"></button>
  <label data-t="file"></label><input id="path" size="24" data-tp="filePlaceholder">
  <button id="replay" data-t="replay"></button><button id="calib" data-t="calibration"></button>
  <span id="error"></span><span id="status" class="num">—</span>
</div>

<div id="strip">
  <span class="chip" id="recchip"></span><span class="chip" id="ph"></span><span class="chip" id="met"></span><span class="chip" id="utc"></span><span class="chip" id="almsum"></span><span class="chip" id="linkq"></span>
</div>

<div id="metrics">
  <div class="metric" id="mm-alt"><div class="k"><span data-t="gpsAlt"></span></div><div class="v" id="m-alt">—</div><div class="sub" data-t="gpsAltNote"></div></div>
  <div class="metric wind" id="mm-rate"><div class="k"><span data-t="rate"></span></div><div class="v" id="m-rate">—</div><div class="sub" id="s-rate">&nbsp;</div></div>
  <div class="metric flight" id="mm-vel"><div class="k"><span data-t="velocity"></span></div><div class="v" id="m-vel">—</div><div class="sub" id="s-vel">&nbsp;</div></div>
  <div class="metric flight" id="mm-omega"><div class="k"><span data-t="omega"></span></div><div class="v" id="m-omega">—</div><div class="sub" id="s-omega">&nbsp;</div></div>
  <div class="metric flight" id="mm-att"><div class="k"><span data-t="attitude"></span></div><div class="v" id="m-att">—</div><div class="sub" data-t="attNote"></div></div>
  <div class="metric wind" id="mm-drift"><div class="k"><span data-t="drift"></span></div>
    <div id="driftbox"><canvas id="c-compass"></canvas><div class="v" id="m-drift">—</div></div><div class="sub" id="s-drift">&nbsp;</div></div>
  <div class="metric wind" id="mm-land"><div class="k"><span data-t="landing"></span><span class="hint"><span data-t="groundAlt"></span> <input id="ground" placeholder="m" inputmode="decimal"></span></div><div class="v" id="m-land">—</div><div class="sub" id="s-land">&nbsp;</div></div>
  <div class="metric" id="mm-gps"><div class="k"><span data-t="fixSats"></span></div><div class="v" id="m-gps">—</div><div class="sub" id="s-gps">&nbsp;</div></div>
  <div class="metric" id="mm-link"><div class="k"><span data-t="lastFrame"></span></div><div class="v" id="m-link">—</div><div class="sub" id="s-link">&nbsp;</div></div>
</div>

<!-- ===== wind-field window ===== -->
<div class="grid wind" id="grid-wind">
  <section class="panel" id="p3d"><h2><span data-t="view3d"></span><span class="st" id="st-3d"></span></h2><canvas id="c3d"></canvas><div class="note" data-t="note3dPath"></div></section>
  <section class="panel" id="p3dc"><h2><span data-t="modeCloud"></span><span class="st" id="st-3dc"></span></h2><canvas id="c3dc"></canvas><div class="note" data-t="note3dCloud"></div></section>
  <section class="panel" id="pmap"><h2><span data-t="topView"></span><span class="st" id="st-map"></span></h2><canvas id="c-map"></canvas><div class="note" id="note-map"></div></section>
  <section class="panel" id="pprof"><h2><span data-t="profile"></span><span class="legend"><span style="color:var(--line2)" data-t="east"></span><span style="color:var(--line3)" data-t="north"></span></span><span class="st" data-t="profileUnit"></span></h2><canvas id="c-prof"></canvas></section>
  <section class="panel" id="pdrift"><h2><span data-t="driftTime"></span><span class="legend"><span style="color:var(--line2)" data-t="east"></span><span style="color:var(--line3)" data-t="north"></span><span style="color:var(--line1)" data-t="speed"></span></span><span class="st" id="st-drift"></span></h2><canvas id="c-drift"></canvas></section>
  <section class="panel" id="pdtab"><h2><span data-t="driftTable"></span><span class="st" id="st-dtab"></span></h2><div class="scroll"><table class="st" id="dtab"></table></div></section>
  <section class="panel" id="pcp"><h2><span data-t="cpTitle"></span><span class="st" id="st-cp"></span></h2><div id="cpbtns"></div><div class="scroll"><table class="st" id="cplist"></table></div></section>
  <section class="panel" id="prawstream"><h2><span data-t="rawStream"></span><span class="st" data-t="rawStreamNote"></span><span class="row2"><input type="checkbox" id="pause"><label for="pause" data-t="pause"></label></span></h2><pre id="rawstream"></pre></section>
</div>

<!-- ===== flight-control screen ===== -->
<div class="grid flight" id="grid-flight">
  <section class="panel" id="pattitude"><h2><span data-t="attView"></span><span class="st" id="st-att"></span></h2><canvas id="c-att"></canvas><div class="note" data-t="attFoot"></div></section>
  <section class="panel" id="pcam"><h2><span data-t="camPanel"></span><span class="st" id="st-cam"></span></h2><div class="imgbox"><img id="jpeg" alt="" hidden><div class="empty" id="cam-empty"></div></div><div id="imgprog"></div></section>
  <section class="panel" id="pqlook"><h2 data-t="qlookPanel"></h2><div class="imgbox"><img id="qlook" alt="" hidden><div class="empty" id="qlook-empty"></div></div></section>
  <section class="panel" id="palt"><h2><span data-t="altTime"></span><span class="st" id="st-alt"></span></h2><canvas id="c-alt"></canvas></section>
  <section class="panel" id="pimu"><h2><span data-t="imu"></span><span class="legend" id="lg-imu"></span><span class="st" id="st-imu"></span></h2><canvas id="c-imu"></canvas></section>
  <section class="panel" id="pomega"><h2><span data-t="omegaChart"></span><span class="legend"><span style="color:var(--line2)">X</span><span style="color:var(--line3)">Y</span><span style="color:var(--line1)">Z</span></span><span class="st" id="st-omega"></span></h2><canvas id="c-omega"></canvas></section>
  <section class="panel" id="pvel"><h2><span data-t="velChart"></span><span class="legend"><span style="color:var(--line1)" data-t="vH"></span><span style="color:var(--line4)" data-t="vV"></span><span style="color:#fff" data-t="v3"></span></span><span class="st" id="st-vel"></span></h2><canvas id="c-vel"></canvas></section>
  <section class="panel" id="patlm"><h2><span data-t="atlm"></span><span class="legend" id="lg-atlm"></span></h2><canvas id="c-atlm"></canvas></section>
  <section class="panel" id="praw"><h2><span data-t="rawTelem"></span><span class="st" data-t="freshNote"></span></h2><div id="raw"></div></section>
  <section class="panel" id="pstream"><h2><span data-t="streams"></span><span class="st" id="st-stream"></span></h2><div class="scroll"><table class="st" id="streams"></table></div></section>
  <section class="panel" id="palarm"><h2><span data-t="alarms"></span><span class="st" id="st-alarm"></span></h2><div class="scroll"><table class="st" id="alarms"></table></div></section>
</div>

<div id="comm" class="flight">
  <section class="panel"><h2><span data-t="terminal"></span><span class="st" data-t="terminalNote"></span></h2>
    <pre id="terminal"></pre>
    <div class="row"><button id="bt-scan" data-t="btScan"></button><button id="bt-connect" data-t="btConnect"></button><input id="term"><input type="checkbox" id="hex"><label for="hex">HEX</label><button id="tsend" data-t="send"></button></div></section>
  <section class="panel"><h2><span data-t="commands"></span><span class="st" id="tx-state"></span></h2>
    <div class="row"><input type="checkbox" id="tx"><label for="tx" data-t="txEnable"></label>
      <label data-t="id"></label><select id="cid"></select><label data-t="value"></label><input id="cval" value="0" size="4">
      <button id="send" data-t="sendCommand"></button><button id="utc-btn" data-t="sendUtc"></button></div>
    <div class="note" data-t="cmdHint"></div>
    <h2 data-t="messages"></h2><pre id="messages"></pre></section>
  <section class="panel"><h2><span data-t="bits"></span><span class="st" data-t="bitsNote"></span></h2><div class="scroll"><div id="bits"></div></div></section>
  <section class="panel"><h2 data-t="events"></h2><pre id="notices"></pre></section>
</div>

<div id="events"><span class="m" id="ev-msg"></span><span class="n" id="ev-note"></span><span class="f num" id="footer"></span></div>

<script src="/i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
const TY = { s:14, m:15, l:24 };   // type scale (px), set from the --s/--m/--l CSS variables
const WINDOW_S = 120, CH_WIN = 60, MAXP = 600, VIRIDIS = ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779", "#6ece58", "#b5de2b", "#fde725"];
const KINDS = ["GPS", "IMU", "ATLM", "DTLM", "MESSAGE", "IMAGE_SIZE", "IMAGE_PROGRESS", "IMAGE", "QLOOK", "ERROR"];
const STREAMING = ["GPS", "IMU", "ATLM", "DTLM"];      // sent continuously; the others are event-driven
const PAGE = location.pathname.startsWith("/wind") ? "wind" : "flight";   // one page, two layouts
document.body.dataset.page = PAGE;
let MARKS = [];                       // [service time, label] of recorded checkpoints, drawn on the time charts
let cfg = null, S = null, busy = false, errTimer = 0, lastDrift = null;
const view = { yaw: -0.65, pitch: 0.5, zoom: 1 };
const rateLog = [], alarmState = new Map(), errorLog = [], txLog = [];
let metStart = null, lastMode = null, cloudCache = { key:null, pts:[] };

/* ---------- text ---------- */
function applyText() {
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-tp]")) el.placeholder = t(el.dataset.tp);
  for (const el of document.querySelectorAll("[data-tt]")) el.title = t(el.dataset.tt);
}
const dirName = deg => t("dirs")[Math.round(deg / 45) % 8];

/* ---------- api ---------- */
async function post(body) {
  try {
    const r = await fetch("/api/action", { method:"POST", body:JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    $("error").textContent = "";
  } catch (e) {
    // a network failure (TypeError "Failed to fetch") means the server process is gone, not that the action was wrong
    $("error").textContent = e instanceof TypeError ? t("serverGone") : e.message;
    clearTimeout(errTimer); errTimer = setTimeout(() => $("error").textContent = "", 8000);
  }
}
const wire = (id, fn) => $(id).addEventListener("click", () => fn());
wire("connect", () => post({ name:"connect", kind:$("kind").value, port:$("port").value, baud:$("baud").value }));
wire("stop", () => { $("tx").checked = false; post({ name:"stop" }); });
wire("rec", async () => { await post({ name: S && S.recording.on ? "record_stop" : "record_start" }); poll(); });
wire("replay", () => post({ name:"replay", path:$("path").value }));
wire("calib", () => post({ name:"calibration", path:$("path").value }));
wire("send", () => post({ name:"command", id:$("cid").value, value:$("cval").value }));

function drawMarks(f, now, xlo) {

    const x = tm - now;
    if (x < xlo || x > 0) return;

/* ---------- attitude: IMU fields 0-2 as X/Y/Z Euler angles (the Tk frontend's preview, mapping unverified) ---------- */

/* ---------- 3D view ---------- */
function draw3D(cv, D, mode, stId) {

  const ee = proj([.5, 0, fl]); label(g, "E", ee[0] + 10, ee[1], { color:css("line4"), size:TY.m });

  }


  const rec = s.recording, mmss = x => `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(Math.floor(x % 60)).padStart(2, "0")}`;
  $("rec").textContent = t(rec.on ? "recStop" : "recStart");
  $("rec").classList.toggle("on", rec.on);
  $("rec").disabled = s.mode === "IDLE";
  const chip = $("recchip");
  chip.className = "chip " + (rec.on ? "on" : s.mode !== "IDLE" ? "idle" : "");
  chip.innerHTML = rec.on ? `<small>${t("recChip")}</small>● ${mmss(rec.elapsed)}` : `<small>${t("recChip")}</small>${t(s.mode !== "IDLE" ? "notRecording" : "recOff")}`;
  const lastMsg = s.messages[s.messages.length - 1], lastNote = s.notices[s.notices.length - 1];
  $("ev-msg").textContent = lastMsg ? `MSG_${lastMsg[1].toString(16).toUpperCase()}  ${lastMsg[2]}` : "";
  $("ev-note").textContent = lastNote ? lastNote[1] : "";
  $("footer").textContent = rec.on ? `LOG ${s.log_directory}` : t("notRecordingFooter");

  const lines = [...s.terminal_text.map(x => [x[0], `RX  ${x[1]}`]), ...txLog.map(x => [x[0], `TX  ${x[1]}`])].sort((a, b) => a[0] - b[0]);
  setText($("terminal"), lines.map(l => `${l[0].toFixed(1)} ${l[1]}`).join("\n"));
  setText($("messages"), s.messages.map(m => `${m[0].toFixed(1)} MSG_${m[1].toString(16).toUpperCase()}  ${m[2]}`).join("\n"));
  $("send").disabled = $("utc-btn").disabled = $("tsend").disabled = !s.can_transmit;
  $("term").placeholder = t(s.can_transmit ? "sendPlaceholder" : "sendDisabled");
  $("bt-scan").disabled = $("bt-connect").disabled = s.mode !== "LIVE";
  $("bt-connect").title = cfg.bluetooth.address ? "ATD" + cfg.bluetooth.address : t("btNoAddress");
  $("tx").disabled = s.mode !== "LIVE";
  if (s.mode !== "LIVE") $("tx").checked = false;
  $("tx-state").textContent = t(s.can_transmit ? "txOn" : "txOff");
  $("tx-state").classList.toggle("on", s.can_transmit);
}
/* linear velocity (from GPS position change) and angular rate (from attitude change): both derived, see the notes */
function renderMotion(s, D, now) {
  const vel = D.d.velocity, om = s.history.omega, last = vel[vel.length - 1], w = om[om.length - 1];
  if (last) {
    const vh = Math.hypot(last[1], last[2]), vz = last[3], v3 = Math.hypot(vh, vz);
    $("m-vel").innerHTML = `${vh.toFixed(1)}<small> ${t("vH")}</small> ${vz.toFixed(1)}<small> ${t("vV")}</small>`;
    const age = now - last[0];                                   // a frozen last value must not read as "now"
    $("s-vel").textContent = age > 3 ? t("stale", age.toFixed(0)) : `3D ${v3.toFixed(1)} m/s · ${t("velNote")}`;
    setMetric("vel", age > 3 ? "warn" : "");
  } else { $("m-vel").textContent = "—"; $("s-vel").textContent = t("velNote"); setMetric("vel", ""); }
  if (w) {
    const mag = Math.hypot(w[1], w[2], w[3]);
    $("m-omega").innerHTML = `${mag.toFixed(0)}<small> °/s</small>`;
    const age = now - w[0];
    $("s-omega").textContent = age > 3 ? t("stale", age.toFixed(0)) : `X ${w[1].toFixed(0)}  Y ${w[2].toFixed(0)}  Z ${w[3].toFixed(0)} · ${t("omegaNote")}`;
    setMetric("omega", age > 3 ? "warn" : "");
  } else { $("m-omega").textContent = "—"; $("s-omega").textContent = t("omegaNote"); setMetric("omega", ""); }
  const axes = [css("line2"), css("line3"), css("line1")];
  drawSeries($("c-omega"), [1, 2, 3].map(i => ({ pts:om.map(r => [r[0], r[i]]), color:axes[i - 1] })), now);
  $("st-omega").textContent = w ? `X ${w[1].toFixed(0)} Y ${w[2].toFixed(0)} Z ${w[3].toFixed(0)} °/s` : "";
  drawSeries($("c-vel"), [
    { pts:vel.map(r => [r[0], Math.hypot(r[1], r[2])]), color:css("line1") },
    { pts:vel.map(r => [r[0], r[3]]), color:css("line4") },
    { pts:vel.map(r => [r[0], Math.hypot(r[1], r[2], r[3])]), color:"#fff" },
  ], now);
  $("st-vel").textContent = last ? `H ${Math.hypot(last[1], last[2]).toFixed(1)}  V ${last[3].toFixed(1)}  m/s` : "";
}
function renderCamera(s) {
  const jp = $("jpeg"), jv = "/api/jpeg?v=" + s.jpeg_size;
  if (s.jpeg_size && jp.dataset.v !== jv) { jp.dataset.v = jv; jp.src = jv; }
  jp.hidden = !s.jpeg_size; $("cam-empty").textContent = s.jpeg_size ? "" : t("camWait");
  // The progress bar moves while pieces arrive even when an image never completes, so say how old the picture is.
  const age = ageOf(s, "IMAGE");
  $("st-cam").textContent = s.jpeg_size ? `${(s.jpeg_size / 1024).toFixed(0)} KiB` + (age == null ? "" : ` · ${t("imgAge", age.toFixed(0))}`) : "";
  $("st-cam").style.color = age != null && age > 6 ? css("warn") : "";
  const qp = $("qlook"), qv = "/api/qlook.png?v=" + s.qlook_version;
  if (s.qlook_version && qp.dataset.v !== qv) { qp.dataset.v = qv; qp.src = qv; }
  qp.hidden = !s.qlook_version; $("qlook-empty").textContent = s.qlook_version ? "" : t("qlookWait");
}
function renderDriftTable(D, now) {
  const rows = D.samples.slice(-60).reverse();
  $("st-dtab").textContent = D.samples.length ? t("driftTableNote", D.d.window_s.toFixed(0), D.samples.length) : "";
  const head = `<tr><th>${t("colAge")}</th><th>${t("colAlt")}</th><th>${t("east")}</th><th>${t("north")}</th><th>${t("speed")}</th><th>${t("colToward")}</th></tr>`;
  const body = rows.length ? rows.map(r => {
    const sp = Math.hypot(r[4], r[5]), deg = bearing(r[4], r[5]);
    return `<tr><td class="n">${(now - r[0]).toFixed(0)} s</td><td class="n">${r[3].toFixed(1)}</td><td class="n">${r[4].toFixed(2)}</td><td class="n">${r[5].toFixed(2)}</td><td class="n">${sp.toFixed(2)}</td><td class="n">${deg.toFixed(0)}° ${dirName(deg)}</td></tr>`;
  }).join("") : `<tr><td colspan="6" style="color:var(--muted)">${driftEmptyText(D.d)}</td></tr>`;
  const html = head + body;
  if ($("dtab").dataset.h !== html) { $("dtab").innerHTML = html; $("dtab").dataset.h = html; }
}
function buildCheckpointButtons() {
  const box = $("cpbtns");
  box.innerHTML = "";
  const mark = document.createElement("button");               // unnamed: for "something just happened"
  mark.className = "mark"; mark.textContent = t("cpMarkBtn");
  mark.addEventListener("click", async () => {
    await post({ name:"checkpoint_mark" });
    mark.classList.add("hit"); setTimeout(() => mark.classList.remove("hit"), 700);
    poll();
  });
  box.appendChild(mark);
  for (const name of cfg.checkpoints) {
    const b = document.createElement("button");
    b.textContent = name;
    b.addEventListener("click", async () => {
      await post({ name:"checkpoint", label:name });
      b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 700);
      poll();                                              // show the new row immediately
    });
    box.appendChild(b);
  }
  const undo = document.createElement("button");
  undo.className = "undo"; undo.textContent = t("cpUndo");
  undo.addEventListener("click", async () => { await post({ name:"checkpoint_undo" }); poll(); });
  box.appendChild(undo);
}
function renderCheckpoints(s) {
  const c = s.checkpoints;
  $("st-cp").textContent = t(c.replay ? "cpReplay" : c.saved ? "cpSaved" : "cpMemory");
  document.querySelectorAll("#cpbtns button").forEach(b => b.disabled = !!c.replay);   // replay is read-only
  const rows = c.items.slice().reverse().map(r =>
    `<tr title="${r.utc}"><td class="t">${r.utc.slice(11, 21)}</td><td>${r.label || `<span style="color:var(--muted)">${t("cpMark", r.id)}</span>`}</td><td class="n">${r.alt_m == null ? "—" : r.alt_m.toFixed(1) + " m"}</td></tr>`).join("");
  const html = `<tr><th>${t("colTimeUtc")}</th><th>${t("colLabel")}</th><th style="text-align:right">${t("colAlt")}</th></tr>` +
    (rows || `<tr><td colspan="3" style="color:var(--muted)">${t("cpEmpty")}</td></tr>`);
  if ($("cplist").dataset.h !== html) { $("cplist").innerHTML = html; $("cplist").dataset.h = html; }
}
function renderRawStream(s) {
  if ($("pause").checked) return;
  setText($("rawstream"), s.terminal.map(x => `${x[0].toFixed(1)}  ${x[1]}   |${x[2]}|`).join("\n"));
}
function renderBits(s) {
  const bits = $("bits");
  if (!bits.children.length) for (let i = 0; i < 32; i++) bits.appendChild(document.createElement("div"));
  [...bits.children].forEach((d, i) => { const v = s.dtlm[i]; d.textContent = String(i).padStart(2, "0"); d.title = `bit ${i} = ${v ?? "—"}`; d.className = v ? "on" : ""; });
  setText($("notices"), s.notices.map(n => `${n[0].toFixed(1)}  ${n[1]}`).join("\n"));
}
function setText(el, text) {
  if (el.textContent === text) return;
  const bottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  el.textContent = text; if (bottom) el.scrollTop = el.scrollHeight;
}
function renderRaw(s) {
  const gps = s.gps || {}, fresh = k => ageOf(s, k) != null && ageOf(s, k) < 3;
  const rows = [
    [t("lat"), gps.fix ? gps.lat.toFixed(6) : "—", "°", "GPS"], [t("lon"), gps.fix ? gps.lon.toFixed(6) : "—", "°", "GPS"],
    [t("alt"), gps.altitude_m == null ? "—" : gps.altitude_m.toFixed(1), "m", "GPS"], [t("sats"), gps.satellites ?? "—", "", "GPS"],
    [t("hdop"), gps.hdop ?? "—", "", "GPS"], ["UTC", gps.utc ?? "—", "", "GPS"],
    ...(s.imu.length ? s.imu : [null, null, null]).map((v, i) => [t("imuField", i), v == null ? "—" : v.toFixed(2), "", "IMU"]),   // every field the kit sends; 3+ are unlabelled on purpose
    ...s.atlm.map((raw, i) => [t("atlmCh", i), s.calibration[i].enabled ? s.analog[i].toFixed(3) : raw, s.calibration[i].enabled ? s.calibration[i].unit : t("raw"), "ATLM"]),
  ];
  const html = rows.map(r => `<div class="kv"><span class="l">${r[0]}</span><span class="r">${r[1]}</span><span class="u">${r[2]}</span><i class="dot ${fresh(r[3]) ? "ok" : ""}"></i></div>`).join("");
  if ($("raw").dataset.h !== html) { $("raw").innerHTML = html; $("raw").dataset.h = html; }
}

async function poll() {
  if (busy) return;
  busy = true;
  try { S = await (await fetch("/api/state")).json(); update(); }
  catch (e) { $("status").textContent = t("serverLost"); $("status").style.color = css("bad"); }
  busy = false;
}

/* ---------- start ---------- */
(async function init() {
  cfg = await (await fetch("/api/config")).json();
  LANG = cfg.language in STR ? cfg.language : "en";
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(cfg.colors)) r.setProperty("--" + k, v);
  const q = f => f.map(n => /\s/.test(n) ? `"${n}"` : n).join(",");
  r.setProperty("--font", q(cfg.font_family) + ",system-ui,sans-serif");
  r.setProperty("--mono", q(cfg.mono_family) + ",ui-monospace,monospace");
  const px = pt => Math.round(pt * 4 / 3);          // [sizes] are points (shared with the Tk frontend)
  TY.m = px(cfg.sizes.base); TY.s = Math.max(13, TY.m - 1); TY.l = Math.round(TY.m * 1.6);
  for (const k of ["s", "m", "l"]) r.setProperty("--" + k, TY[k] + "px");
  applyText(); buildCheckpointButtons();
  for (const k of cfg.transports) $("kind").add(new Option(k, k));
  for (const i of [...Array(24).keys(), 64, 65, 66, 67, 68, 69, 70, 71]) $("cid").add(new Option(i, i));
  try {
    const ports = await (await fetch("/api/ports")).json();
    $("ports").innerHTML = ports.map(p => `<option value="${p.device}">${p.description}</option>`).join("");
    if (ports.length) $("port").value = ports[0].device;
  } catch (e) {}
  const ro = new ResizeObserver(() => { if (S) update(); }); ro.observe($("grid-wind")); ro.observe($("grid-flight"));
  setInterval(poll, 250); poll();
})();
</script>
