# Read automatically at startup (override the file with --ui-config). Every key is optional.
# Families are comma-separated candidates; the first installed one is used.
# Language of the web UI: en or ko.
[ui]
language = en
# Screens opened at start-up, one browser window each: flight, wind (empty = open none).
open_pages = flight, wind

# Checkpoint buttons on the wind-field window (record-only timestamps). Comma separated, up to 12.
# false = a session is watched but not kept until Record is pressed; true = recorded from the first byte.
# (--headless and the Tk window always record: they have no Record button.)
[recording]
auto_start = false

[checkpoints]
labels = Drone ascent start, Drop, Parachute open, Landing

# The USB serial adapter is a Bluetooth master: data only flows after it dials the satellite (ATD<address>).
# Address of the kit's Bluetooth module (12 hex digits). 0001958D78EC is what the first hardware session dialled.
[bluetooth]
address = 0001958D78EC
# true = at start-up, when launched on a live serial port, send ATD<address> once so one command connects everything.
auto_connect = true

[fonts]
font_family = Noto Sans CJK KR, NanumGothic, DejaVu Sans
mono_family = DejaVu Sans Mono, NanumGothicCoding
plot_family = NanumGothic, Noto Sans CJK KR, DejaVu Sans

[sizes]
# The web UI uses only "base" (small = base-1px, large = 1.6 x base). The others are for the Tk frontend.
base = 11
status = 12
metric = 14
log = 9
plot = 9

# #rrggbb only. Unlisted names keep the built-in value.
[colors]
bg = #000000
panel = #05111f
border = #ffffff
text = #ffffff
muted = #b0b0b0
grid = #045956
button = #514c4b
button_active = #6e6968
ok = #00ff00
warn = #ffff00
bad = #ff0000
line1 = #00ffff
line2 = #ff0000
line3 = #00ff00
line4 = #ffff00
on = #005a1f

# Alarm thresholds. 0 disables a numeric check.
[alarms]
link_warn_s = 3
link_alarm_s = 10
stream_stale_s = 10
min_satellites = 4
max_hdop = 5
error_burst = 3
# Link quality is judged over the last 30 s as the worse of: valid frames / all frames, and images completed / started.
quality_warn_pct = 95
quality_bad_pct = 80
